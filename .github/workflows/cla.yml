# Records signatures for the Contributor Assignment Agreement.
#
# Signatures are stored as a JSON file in a SEPARATE private repository, not in this one: the
# record contains contributor names and timestamps, and it is rewritten on every signature, which
# would otherwise churn this repository's history with personal data.
#
# Before enabling, create that repository and add a PAT with `repo` scope as the
# PERSONAL_ACCESS_TOKEN secret, then set the path below.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the signature
        # Skips the owner's own pull requests: the owner is the assignee.
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/rd-api-server.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          # Set this to the private signature repository, e.g. "your-org/cla-signatures".
          remote-repository-name: ${{ vars.CLA_SIGNATURES_REPO }}
          allowlist: dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. This project requires a signed
            [Contributor Assignment Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            before code or documentation can be merged — it assigns copyright to the project owner
            so the licence can be changed in future without tracking down every contributor. You
            keep the right to use your own work however you like. To sign, reply with:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks.'
